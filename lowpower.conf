# Battery build for the controller board: add after ptx.conf, e.g.
#   -DEXTRA_CONF_FILE="ptx.conf;lowpower.conf"
# No USB console (the USB stack and CDC ACM serial port are left out
# entirely), no logging, no RTT stats timer.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_APP_RTT_STATS=n
