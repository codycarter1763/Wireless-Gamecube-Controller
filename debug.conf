# Debug add-on for the controller: USB serial console + radio round-trip
# stats. Add after ptx.conf:
#   -DEXTRA_CONF_FILE="ptx.conf;debug.conf"
# Draws more power (USB stack, stats timer); don't use it on battery.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_APP_RTT_STATS=y
