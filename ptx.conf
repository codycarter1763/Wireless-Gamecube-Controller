# Controller board (PTX). This is the battery build by default: no USB
# stack or serial console, no RTT stats timer.
# For serial output while developing, add debug.conf after this file:
#   -DEXTRA_CONF_FILE="ptx.conf;debug.conf"
CONFIG_APP_ROLE_PTX=y

CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_APP_RTT_STATS=n
