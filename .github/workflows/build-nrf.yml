name: Test and build nRF52840 firmware

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  NCS_VERSION: v3.4.2          # match your local nRF Connect SDK
  APP_DIR: .                   # project folder, relative to the repo root
  NCS_DIR: ${{ github.workspace }}/../ncs
  ZEPHYR_TOOLCHAIN_VARIANT: gnuarmemb
  GNUARMEMB_TOOLCHAIN_PATH: /usr
  BOARD: promicro_nrf52840/nrf52840/uf2

jobs:
  # Unit tests for the pure logic (src/gc_logic.c) on the native_sim board:
  # runs on the CI machine itself, no hardware needed. Firmware is only
  # built if these pass.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q device-tree-compiler ninja-build
          pip install west gcovr

      # The SDK checkout (~1.8 GB) is cached per NCS version.
      - name: Cache nRF Connect SDK
        id: ncs-cache
        uses: actions/cache@v5
        with:
          path: ${{ env.NCS_DIR }}
          key: ncs-${{ env.NCS_VERSION }}-min-v1

      - name: Fetch nRF Connect SDK
        if: steps.ncs-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$NCS_DIR" && cd "$NCS_DIR"
          west init -m https://github.com/nrfconnect/sdk-nrf --mr "$NCS_VERSION"
          # Only the modules this project needs (ESB, nrfx, Zephyr, libc).
          west config manifest.project-filter -- \
            "-.*,+zephyr,+nrfxlib,+hal_nordic,+cmsis_6,+cmsis,+segger,+mbedtls,+oberon-psa-crypto,+mcuboot,+tinycrypt,+picolibc,+zcbor,+trusted-firmware-m,+psa-arch-tests"
          west update --narrow -o=--depth=1 zephyr
          west update --narrow -o=--depth=1

      - name: Install Python requirements
        run: pip install -r "$NCS_DIR/zephyr/scripts/requirements-base.txt"

      - name: Run unit tests (native_sim)
        env:
          ZEPHYR_TOOLCHAIN_VARIANT: host
        run: |
          cd "$NCS_DIR"
          west build -p -b native_sim/native/64 --no-sysbuild \
            -d "$GITHUB_WORKSPACE/build_tests" \
            "$GITHUB_WORKSPACE/$APP_DIR/tests/unit" -t run \
            -- -DCONFIG_COVERAGE=y

      # Coverage of src/gc_logic.c: summary on the run page, HTML report as
      # an artifact. Fails if line coverage drops below 90 %.
      - name: Coverage report
        run: |
          mkdir -p coverage
          cd build_tests
          gcovr -r "$GITHUB_WORKSPACE/$APP_DIR" --filter '.*/src/gc_logic\.c' \
            --html-details ../coverage/index.html \
            --txt ../coverage/summary.txt --fail-under-line 90 .
          { echo '### Unit test coverage'; echo '```'; cat ../coverage/summary.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage/

  build:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: ptx
            name: controller          # battery build (default)
            conf: "ptx.conf"
          - role: ptx
            name: controller-debug    # + USB serial console, stats
            conf: "ptx.conf;debug.conf"
          - role: prx
            name: receiver
            conf: "prx.conf"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-arm-none-eabi libnewlib-arm-none-eabi \
            device-tree-compiler ninja-build
          pip install west adafruit-nrfutil

      # The SDK checkout (~1.8 GB) is cached per NCS version.
      - name: Cache nRF Connect SDK
        id: ncs-cache
        uses: actions/cache@v5
        with:
          path: ${{ env.NCS_DIR }}
          key: ncs-${{ env.NCS_VERSION }}-min-v1

      - name: Fetch nRF Connect SDK
        if: steps.ncs-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$NCS_DIR" && cd "$NCS_DIR"
          west init -m https://github.com/nrfconnect/sdk-nrf --mr "$NCS_VERSION"
          # Only the modules this project needs (ESB, nrfx, Zephyr, libc).
          west config manifest.project-filter -- \
            "-.*,+zephyr,+nrfxlib,+hal_nordic,+cmsis_6,+cmsis,+segger,+mbedtls,+oberon-psa-crypto,+mcuboot,+tinycrypt,+picolibc,+zcbor,+trusted-firmware-m,+psa-arch-tests"
          west update --narrow -o=--depth=1 zephyr
          west update --narrow -o=--depth=1

      - name: Install Python requirements
        run: pip install -r "$NCS_DIR/zephyr/scripts/requirements-base.txt"

      - name: Build ${{ matrix.name }}
        run: |
          cd "$NCS_DIR"
          west build -p -b "$BOARD" --no-sysbuild \
            -d "$GITHUB_WORKSPACE/build_${{ matrix.name }}" \
            "$GITHUB_WORKSPACE/$APP_DIR" \
            -- "-DEXTRA_CONF_FILE=${{ matrix.conf }}"
          cp "$GITHUB_WORKSPACE/build_${{ matrix.name }}/zephyr/zephyr.uf2" \
             "$GITHUB_WORKSPACE/gc_${{ matrix.name }}.uf2"

      # Bluetooth OTA package for the controller (L+R+Z+A for 5 s, then
      # send this zip to "AdaDFU" with the nRF Connect / nRF Toolbox app).
      - name: Make OTA package
        if: matrix.role == 'ptx'
        run: |
          adafruit-nrfutil dfu genpkg --dev-type 0x0052 \
            --application "build_${{ matrix.name }}/zephyr/zephyr.hex" \
            "gc_${{ matrix.name }}_ota.zip"

      - name: Upload firmware
        uses: actions/upload-artifact@v6
        with:
          name: firmware-${{ matrix.name }}
          path: |
            gc_${{ matrix.name }}.uf2
            gc_${{ matrix.name }}_ota.zip
            build_${{ matrix.name }}/zephyr/zephyr.hex
            build_${{ matrix.name }}/zephyr/zephyr.elf